{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Territory Manager{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ LIFF SDK (LINE MINI App) -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- ✅ Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Tailwind config (safelist + custom colors 를 한 번에 선언) -->
  <script>
    tailwind.config = {
      safelist: [
        'peer',
        'peer-checked:block',
        'hidden',
        'block',
        'absolute',
        'ring-2',
        'ring-blue-500',
        'border-blue-600',
        'bg-red-100',
        'bg-orange-100',
        'bg-emerald-100',
        'border-red-300',
        'border-orange-300',
        'border-emerald-300',
        'text-blue-800',
        'text-blue-600',
        // territory_cards 방문상태 색 (mapping.STATUS_COLORS 와 동기화)
        'bg-emerald-100', 'border-emerald-300', 'text-emerald-800',
        'bg-lime-100', 'border-lime-300', 'text-lime-800',
        'bg-amber-100', 'border-amber-300', 'text-amber-800',
        'bg-gray-100', 'bg-gray-200', 'border-gray-300', 'text-gray-700',
        'bg-pink-100', 'border-pink-300', 'text-pink-800',
        'bg-blue-100', 'border-blue-300', 'text-blue-800',
        'bg-red-100', 'border-red-300', 'text-red-800',
        'bg-teal-100', 'border-teal-300', 'text-teal-800',
        'bg-purple-100', 'border-purple-300', 'text-purple-800',
        'bg-indigo-100', 'border-indigo-300', 'text-indigo-800',
        // territory_cards 탭 타일 (mapping.VISIT_RECENCY_COLORS + 배정 타일 흐림 + J2 두 줄 표시)
        'border', 'opacity-60', 'line-clamp-2', 'break-all', 'leading-tight'
      ],
      theme: {
        extend: {
          colors: {
            ivory: '#fdfaf6',
          }
        }
      }
    }
  </script>

  <!-- ✅ Alpine.js (선택 사항) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- ✅ Header -->
  <header class="bg-white shadow">
    <div class="max-w-7xl text-center px-4 py-4 sm:px-6 lg:px-8">
      <h1 class="text-xl font-bold text-gray-800">{% block header %}📍 {{ congregation_name }} 구역관리 {% endblock %}</h1>
    </div>
  </header>

  <!-- ✅ Main Content -->
  <main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 bg-sky-50 rounded-xl">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- ✅ Footer -->
  <footer class="bg-gray-200 text-center text-sm text-gray-600 py-4">
    &copy; {{ now.year }} {{ congregation_name }} 구역관리 시스템
  </footer>

  <!-- ✅ 페이지 이동 중 로딩 표시 (전역) — 링크/폼으로 다음 화면을 기다리는 동안 스피너 -->
  <div id="nav-loading" class="hidden fixed inset-0 z-50 bg-white/60 flex items-center justify-center">
    <div class="w-10 h-10 rounded-full border-4 border-indigo-200 border-t-indigo-600 animate-spin"></div>
  </div>

  <script>
    // 스와이프 백 등으로 bfcache 에서 복원된 페이지는 서버 요청 없이 옛 DOM 이
    // 그대로 보인다(방금 기록한 방문이 목록에 반영 안 됨). 복원 감지 시 새로고침.
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) location.reload();
    });

    // ── 페이지 이동 로딩 표시 ──
    // 같은 창 내비게이션(링크 클릭/폼 제출)이 시작되면 스피너를 '즉시'(동기) 띄운다.
    // 지연 표시(setTimeout)는 금물 — 내비게이션이 시작되면 브라우저(특히 Safari/
    // LIFF 웹뷰)가 현재 페이지의 화면 갱신을 멈춰, 늦게 바꾼 DOM 은 그려지지 않는다.
    // 빠른 전환의 깜빡임은 지연이 아니라 data-warm(서버가 렌더 시점에 자기 캐시
    // 상태를 알고 심는 힌트 — 캐시 적중 예상 링크)으로 막는다. fetch 는 대상 아님.
    (function () {
      const overlay = document.getElementById('nav-loading');

      function show() {
        overlay.classList.remove('hidden');
        // 외부 앱 스킴 등으로 실제 이동이 일어나지 않는 예외 상황의 잔존 방지.
        setTimeout(hide, 15000);
      }
      function hide() {
        overlay.classList.add('hidden');
      }

      document.addEventListener('click', function (e) {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a || e.defaultPrevented) return;
        if (a.dataset.warm) return;                            // 캐시 적중 예상 — 생략
        if (a.target && a.target !== '_self') return;          // 새 탭/외부 창
        if (a.hasAttribute('download')) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        const href = a.getAttribute('href') || '';
        // 같은 창의 http(s)/상대 경로 이동만 — 앵커(#)·전화·지도앱 스킴 등은 제외.
        if (!/^(https?:|\/|\.|\?)/.test(href)) return;
        show();
      });

      document.addEventListener('submit', function (e) {
        // 폼 제출(탭 진입/반납 등)은 캐시 없는 정합성 경로라 항상 표시.
        if (!e.defaultPrevented) show();  // fetch 저장은 submit 이벤트가 아님
      });

      // 이동 완료/복귀 시 정리 — bfcache 복귀(iOS 뒤로가기)로 스피너가 남는 것 방지.
      window.addEventListener('pageshow', hide);
      window.addEventListener('pagehide', hide);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
{# 500 은 서버(템플릿/컨텍스트 계층 포함)가 고장난 상황에서 렌더된다. #}
{# base 상속·CDN·컨텍스트 어디에도 의존하지 않는 완전 독립 페이지로 유지할 것. #}
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일시적인 문제가 생겼어요</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f3f4f6; font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.15);
            padding: 2rem; margin: 1rem; max-width: 24rem; text-align: center; }
    .emoji { font-size: 3rem; margin: 0; }
    h1 { font-size: 1.125rem; color: #1f2937; margin: .75rem 0; }
    p { font-size: .875rem; color: #4b5563; line-height: 1.6; margin: 0 0 1.25rem; }
    a, button { display: inline-block; padding: .75rem 1.5rem; margin: 0 .25rem; border: 0;
                border-radius: 8px; font-size: .875rem; font-weight: 700; cursor: pointer;
                text-decoration: none; }
    .retry { background: #2563eb; color: #fff; }
    .home  { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <div class="card">
    <p class="emoji">🛠️</p>
    <h1>일시적인 문제가 생겼어요</h1>
    <p>죄송합니다. 처리 중에 문제가 발생했습니다.<br>
       잠시 후 다시 시도해 주세요.<br>
       계속 반복되면 관리자에게 알려주세요.</p>
    <button class="retry" onclick="location.reload()">다시 시도</button>
    <a class="home" href="/cards/">홈으로</a>
  </div>
</body>
</html>
